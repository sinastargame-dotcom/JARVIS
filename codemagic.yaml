workflows:
  jarvis-android:
    name: JARVIS Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          flutter create --platforms=android --org com.jarvis --project-name jarvis_mobile .
          cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
